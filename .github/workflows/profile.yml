name: Validate profile sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/icons/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate collection and rendering
        run: python3 -B -m unittest discover -s tests -v
      - name: Check icon generator
        run: python3 -B scripts/render_profile.py --icons-only

# Codex activity is refreshed by the authenticated private host.
# GitHub Actions needs no Codex credentials and no longer generates snakes.
