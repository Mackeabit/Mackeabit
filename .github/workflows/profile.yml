name: Update profile and contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - "scripts/**"
      - "tests/**"
      - "assets/icons/**"
      - "assets/logo.png"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check activity collection rules
        run: python3 -B -m unittest discover -s tests -v

      - name: Collect real activity from public repositories
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 -B scripts/collect_activity.py

      - name: Read the existing pinned snake renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Platane/snk
          ref: d8f6715049803e982ee5ff501b6b9b7d5deeb09b
          path: .tmp/snk
          persist-credentials: false

      - name: Generate the same snake design from repository activity
        run: node scripts/render_snake.mjs

      - name: Prepare standalone icons and contribution animations
        run: python3 -B scripts/render_profile.py

      - name: Publish updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/accent.svg assets/tools/ generated/
          if git diff --cached --quiet; then
            echo "Profile already up to date."
            exit 0
          fi
          git commit -m "Refresh profile with latest GitHub contributions"
          git push origin HEAD:main
